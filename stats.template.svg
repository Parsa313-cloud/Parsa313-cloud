<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <style>
    .heading { animation: slidein 12s ease-out infinite; }
    .underline { animation: bar 12s ease-out infinite; transform-origin: left center; }
    .meta { animation: fade 12s ease-in-out infinite; }
    .stat { animation: fadeUp 12s ease-out infinite; }
    .s0 { animation-delay: 0.3s }
    .s1 { animation-delay: 0.45s }
    @keyframes slidein { 0% { opacity: 0; transform: translateX(-12px) } 8% { opacity: 1; transform: translateX(0) } 90% { opacity: 1; transform: translateX(0) } 100% { opacity: 0; transform: translateX(0) } }
    @keyframes bar { 0%, 14% { transform: scaleX(0) } 24%, 88% { transform: scaleX(1) } 100% { transform: scaleX(1) } }
    @keyframes fade { 0%, 22% { opacity: 0 } 32%, 90% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes fadeUp { 0%, 22% { opacity: 0; transform: translateY(8px) } 36%, 90% { opacity: 1; transform: translateY(0) } 100% { opacity: 0; transform: translateY(0) } }
  </style>
  
  <rect width="100%" height="100%" fill="#31024b" rx="14" ry="14"/>

  <text class="heading" x="48" y="84" fill="#f7f7fb" font-family="sans-serif" font-size="36" font-weight="700">Activity.</text>
  <rect class="underline" x="48" y="96" width="180" height="2" fill="#bf03b9"/>

  <text class="meta" x="48" y="125" fill="#a5a5b3" font-family="monospace" font-size="11" letter-spacing="1">@PARSA313-CLOUD  •  {TOTAL_CONTRIBUTIONS} CONTRIBUTIONS</text>

  <g transform="translate(48 170)">
    <g class="stat s0">
      <text x="0" y="0" fill="#a5a5b3" font-family="monospace" font-size="10">REPOS</text>
      <text x="0" y="35" fill="#f7f7fb" font-family="sans-serif" font-size="34" font-weight="700">{REPOS_COUNT}</text>
    </g>
    <g class="stat s1" transform="translate(300 0)">
      <text x="0" y="0" fill="#a5a5b3" font-family="monospace" font-size="10">COMMITS</text>
      <text x="0" y="35" fill="#f7f7fb" font-family="sans-serif" font-size="34" font-weight="700">{COMMITS_COUNT}</text>
    </g>
  </g>

  <!-- بخش زبان‌ها -->
  <g transform="translate(48 250)">
    <rect width="704" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>
    {LANG_BARS}
  </g>
  <g transform="translate(48 280)">
    {LANG_LABELS}
  </g>
</svg>
