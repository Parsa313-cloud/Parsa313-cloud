<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <style>
    .heading { animation: slidein 12s ease-out infinite; }
    .underline { animation: bar 12s ease-out infinite; transform-origin: left center; }
    .meta { animation: fade 12s ease-in-out infinite; }
    .corner { animation: cornerSlide 12s ease-out infinite; }
    .stat { animation: fadeUp 12s ease-out infinite; }
    .s0 { animation-delay: 0.3s }
    .s1 { animation-delay: 0.45s }
    @keyframes slidein { 0% { opacity: 0; transform: translateX(-12px) } 8% { opacity: 1; transform: translateX(0) } 90% { opacity: 1; transform: translateX(0) } 100% { opacity: 0; transform: translateX(0) } }
    @keyframes bar { 0%, 14% { transform: scaleX(0) } 24%, 88% { transform: scaleX(1) } 100% { transform: scaleX(1) } }
    @keyframes fade { 0%, 22% { opacity: 0 } 32%, 90% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes fadeUp { 0%, 22% { opacity: 0; transform: translateY(8px) } 36%, 90% { opacity: 1; transform: translateY(0) } 100% { opacity: 0; transform: translateY(0) } }
    @keyframes cornerSlide { 0%, 8% { opacity: 0; transform: translateX(-8px) } 18%, 90% { opacity: 0.6; transform: translateX(0) } 100% { opacity: 0; transform: translateX(0) } }
  </style>
  <defs>
    <linearGradient id="sleek-stats-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#31024b"/>
      <stop offset="100%" stop-color="#31024b" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#sleek-stats-bg)" rx="16"/>
  <path d="M764 88v16M764 88h-16" stroke="#c026d3" stroke-width="2" class="corner" opacity="0.6"/>
  <path d="M36 88v16M36 88h-16" stroke="#c026d3" stroke-width="2" transform="scale(-1 1) translate(-168 0)" class="corner" opacity="0.6"/>
  <g transform="translate(48 106)">
    <text x="0" y="0" fill="#fff" font-family="ui-monospace, monospace" font-weight="700" font-size="44" class="heading">Activity.</text>
    <rect x="0" y="8" width="180" height="2" fill="#c026d3" class="underline"/>
    <text x="0" y="32" fill="#a5a5b3" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4" class="meta">
      @PARSA313-CLOUD · {TOTAL_CONTRIBUTIONS} CONTRIBUTIONS · GRAPHQL
    </text>
  </g>
  <g transform="translate(48 156)" class="stat s0">
    <text x="0" y="0" fill="#a5a5b3" font-family="ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1.2">REPOS</text>
    <text x="0" y="36" fill="#fff" font-family="ui-monospace, monospace" font-weight="700" font-size="36">{REPOS_COUNT}</text>
    <text x="0" y="48" fill="#a5a5b3" font-family="ui-monospace, monospace" font-size="10">{REPOS_COUNT} indexed</text>
  </g>
  <g transform="translate(400 156)" class="stat s1">
    <text x="0" y="0" fill="#a5a5b3" font-family="ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1.2">COMMITS</text>
    <text x="0" y="36" fill="#fff" font-family="ui-monospace, monospace" font-weight="700" font-size="36">{COMMITS_COUNT}</text>
    <text x="0" y="48" fill="#a5a5b3" font-family="ui-monospace, monospace" font-size="10">this year</text>
  </g>
  <g transform="translate(0 0)">
    <rect x="48" y="254" width="704" height="6" rx="3" fill="#ffffff" fill-opacity="0.1"/>
    {LANG_BARS}
    {LANG_LABELS}
  </g>
</svg>
